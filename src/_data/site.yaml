how_we_work: "My work aims to measure in a rigorous way what happens inside organizations. The default approach to this work is team based, working on projects with long-running teams of researchers, fellows and partner organizations, built over many years. We work with companies and governments as partners, make our data available to other researchers, and train the next generation of researchers along the way."

projects:
  - {label: "Data · Co-founder", name: "World Management Survey", text: "The first dataset to measure management practices across countries and industries with one consistent method: manufacturing firms, retailers, hospitals and schools.", url: "https://worldmanagementsurvey.org", linktext: "worldmanagementsurvey.org"}
  - {label: "Lab · Faculty Co-Director", name: "Digital Reskilling Lab", text: "With Jorge Tamayo at HBS. Do training programs reach the workers who need them most, and do they work? We test programs with companies and public agencies.", url: "https://aiinstitute.hbs.edu/labs/digital-reskilling-lab/", linktext: "Digital Reskilling Lab"}
  - {label: "Project · Co-Principal Investigator", name: "Scientific Labs Management Project", text: "How management practices in scientific laboratories affect research productivity and innovation. With Pierre Azoulay, Paul Niehaus, Daniela Scur, John Van Reenen and Heidi Williams; funded by the Alfred P. Sloan Foundation and the Institute for Progress.", url: "https://labsmanagement.org/project-team/", linktext: "labsmanagement.org"}
  - {label: "Data · US Census Bureau", name: "Management in US Hospitals (MOPS-HP)", text: "The first large-scale survey of management practices in US hospitals, run by the Census Bureau across about 3,200 general hospitals.", url: "https://www.census.gov/programs-surveys/mops-hp.html", linktext: "census.gov"}
  - {label: "Policy · Chair, Scientific Committee", name: "Fondo per la Repubblica Digitale", text: "A €350 million Italian public-private fund for digital skills. The scientific committee I chair checks whether funded projects actually improve people’s skills and job prospects, and publishes the results.", url: "https://www.fondorepubblicadigitale.it/", linktext: "fondorepubblicadigitale.it"}
  - {label: "Project · Faculty Co-Chair", name: "Project on Israel and the Regional Economy", text: "A Harvard Business School hub for research on the economies of Israel and the wider Middle East and North Africa, co-chaired with Paul Gompers. Current work covers the startup and innovation ecosystem and reskilling programs.", url: "https://www.hbs.edu/about/research/israel-regional-economy", linktext: "hbs.edu"}
  - {label: "Research network · Director", name: "NBER Organizational Economics Working Group", text: "I direct the National Bureau of Economic Research working group on organizational economics, which brings together economists studying how firms, government agencies and non-profit organizations are structured and run. The group meets each spring and fall.", url: "https://www.nber.org/programs-projects/programs-working-groups/organizational-economics", linktext: "nber.org"}

